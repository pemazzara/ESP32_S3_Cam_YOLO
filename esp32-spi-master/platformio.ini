; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32

board = esp32-s3-devkitc-1
;board = esp32s3usbotg

framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi ; Habilita la PSRAM externa
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB ; O 8MB/16MB según tu modelo
board_build.filesystem = spiffs


monitor_filters =
    esp32_exception_decoder
build_type = debug

lib_ignore = ArduinoOTA

lib_deps = 
    https://github.com/espressif/arduino-esp32.git
    madhephaestus/ESP32Servo
    https://github.com/pololu/vl53l0x-arduino.git#1.3.0  ; Biblioteca VL53L0X de Pololu
    links2004/WebSockets @ ^2.4.1
    adafruit/Adafruit BusIO@^1.14.1

;extra_scripts = 
;    pre:compress_html.py

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I include
    -I src/speed_controller