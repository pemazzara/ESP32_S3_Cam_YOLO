    <style>

<script>
// ==================== CONFIGURACIÓN ====================
const WS_URL = `ws://${window.location.hostname}:81`; 
const INPUT_SIZE = 640;
const CONF_THRESHOLD = 0.25;
const IOU_THRESHOLD = 0.45;
const CLASS_TARGET = 0; 

const CMD_STOP  = 0x00;
const CMD_DRIVE = 0x01;
const CMD_HEART = 0x02;
const CMD_RESET_EMERGENCY = 0x03;  // ← NUEVO
const CMD_RESET_ODOMETRY  = 0x04;  // ← NUEVO
const CMD_REQUEST_TELEMETRY = 0x05; // ← NUEVO (opcional)


const DISTANCIA_SEGURA = 50;
const DISTANCIA_PRECAUCION = 150;
// Variables para evitar STOP innecesarios
let lastDriveCommandTime = 0;
const DRIVE_COMMAND_TIMEOUT = 500; // ms - mantener último comando DRIVE por 500ms

// ==================== VARIABLES GLOBALES ====================
let ws = null;
let wsConnected = false;
let session = null;
let currentMode = 'manual';
let isProcessing = false;
let fpsCounter = 0;
let lastFpsTime = performance.now();
let animationFrameId = null;
let manualInterval = null;
let heartbeatInterval = null;
let voiceRecognition = null;

// Variables globales para sensores ToF
let tofFrontal = 255;
let tofIzquierdo = 255;
let tofDerecho = 255;

// Elementos del DOM
const imgStream = document.getElementById('mjpegStream');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const lblStatus = document.getElementById('lblStatus');
const wsStatus = document.getElementById('wsStatus');
const fpsDisplay = document.getElementById('fps');
const voiceLog = document.getElementById('voiceLog');
const micIcon = document.getElementById('micIcon');

// Canvas auxiliar para preprocesamiento
const offscreenCanvas = document.createElement('canvas');
const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

// Panel references
const panelManual = document.getElementById('panelManual');
const panelYolo = document.getElementById('panelYolo');
const panelVoice = document.getElementById('panelVoice');

// ==================== CAMBIO DE MODOS ====================
document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        // Actualizar botones activos
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const newMode = btn.dataset.mode;
        
        // Si ya estamos en ese modo, no hacer nada
        if (currentMode === newMode) return;
        
        // Detener modo anterior
        stopPreviousMode();
        
        // Cambiar al nuevo modo
        currentMode = newMode;
        
        // Mostrar/Ocultar Paneles
        panelManual.classList.add('hidden');
        panelYolo.classList.add('hidden');
        panelVoice.classList.add('hidden');
        
        switch(currentMode) {
            case 'manual':
                panelManual.classList.remove('hidden');
                lblStatus.innerText = '✅ Modo: MANUAL';
                break;
            case 'yolo':
                panelYolo.classList.remove('hidden');
                lblStatus.innerText = '📹 Modo: YOLO - Iniciando...';
                initYOLO();
                break;
            case 'voice':
                panelVoice.classList.remove('hidden');
                lblStatus.innerText = '🎤 Modo: VOZ';
                startVoiceRecognition();
                break;
        }
        
        stop(); // Detener robot al cambiar de modo
    });
});

function stopPreviousMode() {
    // Detener bucle YOLO si está activo
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
    }
    isProcessing = false;
    
    // Detener reconocimiento de voz
    if (currentMode === 'voice') {
        stopVoiceRecognition();
    }
    
    // Limpiar intervalos manuales
    clearInterval(manualInterval);
    manualInterval = null;
}

// ==================== CONTROLES MANUALES ====================
document.querySelectorAll('.ctrl-btn').forEach(btn => {
    if (btn.id === 'btnStop') return;
    
    btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (currentMode !== 'manual') return;
        const angle = parseInt(btn.dataset.angle);
        const speed = parseInt(btn.dataset.speed);
        drive(angle, speed, false);
        clearInterval(manualInterval);
        manualInterval = setInterval(() => drive(angle, speed, false), 100);
    });
    
    btn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        clearInterval(manualInterval);
        stop();
    });
    
    btn.addEventListener('pointerleave', () => {
        clearInterval(manualInterval);
        stop();
    });
});

document.getElementById('btnResetEmergency').addEventListener('click', () => {
    sendPacket(CMD_RESET_EMERGENCY, 128, 128, 90, 0, false);
    console.log('🔄 Enviado comando RESET EMERGENCY');
});

document.getElementById('btnResetOdometry').addEventListener('click', () => {
    sendPacket(CMD_RESET_ODOMETRY, 128, 128, 90, 0, false);
    console.log('📍 Enviado comando RESET ODOMETRY');
});

document.getElementById('btnStop').addEventListener('click', (e) => {
    e.preventDefault();
    clearInterval(manualInterval);
    stop();
});

// ==================== WEBSOCKET ====================
document.getElementById('btnConnect').addEventListener('click', () => {
    if (ws && wsConnected) {
        ws.close();
    } else {
        connectWebSocket();
    }
});

function connectWebSocket() {
    lblStatus.innerText = '🔗 Conectando WebSocket...';
    try {
        ws = new WebSocket(WS_URL);
        ws.binaryType = 'arraybuffer';
        
        ws.onopen = () => {
            wsConnected = true;
            wsStatus.innerHTML = '🟢 WS';
            lblStatus.innerText = `✅ Conectado - Modo ${currentMode.toUpperCase()}`;
            
            // Iniciar heartbeat
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if (wsConnected) {
                    sendPacket(CMD_HEART, 128, 128, 90, 0, false);
                }
            }, 2000);
        };
        
        ws.onclose = () => {
            wsConnected = false;
            wsStatus.innerHTML = '🔴 WS';
            lblStatus.innerText = '❌ Desconectado. Reconectando...';
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            setTimeout(connectWebSocket, 3000);
        };
        
        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
            lblStatus.innerText = '⚠️ Error de conexión WS';
        };
        
        ws.onmessage = (event) => {
            const data = new Uint8Array(event.data);
            if (data[0] === 0xBB && data[1] === 0x66) {
                updateHUD(data);
            }
        };
    } catch (e) {
        lblStatus.innerText = '⚠️ Error iniciando WS.';
        console.error('WS connection error:', e);
    }
}

function updateHUD(data) {
    const bat = data[2] || 0;
    const spd = data[3] || 0;
    tofFrontal = data[4] || 255;
    tofDerecho = data[5] || 255;
    tofIzquierdo = data[6] || 255;
    
    document.getElementById('hudBat').textContent = bat;
    document.getElementById('hudSpd').textContent = spd;
    document.getElementById('hudTofF').textContent = tofFrontal;
    document.getElementById('hudTofL').textContent = tofIzquierdo;
    document.getElementById('hudTofR').textContent = tofDerecho;
    
    wsStatus.textContent = '🟢 WS';
        // Actualizar estado del sistema
    const wsStatusEl = document.getElementById('wsStatus');
    if (systemFlags & 0x01) {
        wsStatusEl.textContent = '🔴 EMERGENCY';
        wsStatusEl.style.color = '#ff0000';
    } else if (systemFlags & 0x02) {
        wsStatusEl.textContent = '🟡 FAILSAFE';
        wsStatusEl.style.color = '#ffaa00';
    } else {
        wsStatusEl.textContent = '🟢 WS';
        wsStatusEl.style.color = '';
    }
    
    // ESCUDO DE SEGURIDAD
    if (tofFrontal < DISTANCIA_SEGURA && tofFrontal > 0) {
        console.warn(`🛑 FRENO DE EMERGENCIA: Obstáculo a ${tofFrontal}cm`);
        stop();
        clearInterval(manualInterval);
    }
}

// ==================== PAQUETE BINARIO ====================
function buildPacket(cmdId, xCent, yCent, angleDeg, speed, reverse = false) {
    const buf = new ArrayBuffer(12);
    const view = new DataView(buf);
    let offset = 0;
    view.setUint8(offset++, 0xAA);
    view.setUint8(offset++, 0x55);
    view.setUint8(offset++, cmdId);
    view.setUint16(offset, xCent, true); offset += 2;
    view.setUint16(offset, yCent, true); offset += 2;
    view.setInt16(offset, Math.round(angleDeg * 10), true); offset += 2;
    view.setUint8(offset++, Math.min(255, speed));
    view.setUint8(offset++, reverse ? 0x01 : 0x00);
    const payload = new Uint8Array(buf, 2, 9);
    view.setUint8(offset, crc8(payload));
    return new Uint8Array(buf);
}

function crc8(data) {
    let crc = 0x00;
    for (let i = 0; i < data.length; i++) {
        let byte = data[i];
        for (let bit = 0; bit < 8; bit++) {
            let mix = (crc ^ byte) & 0x01;
            crc >>= 1;
            if (mix) crc ^= 0x8C;
            byte >>= 1;
        }
    }
    return crc;
}

function sendPacket(cmdId, xCent, yCent, angleDeg, speed, reverse) {
    if (!ws || !wsConnected) return;
    const packet = buildPacket(cmdId, xCent, yCent, angleDeg, speed, reverse);
    ws.send(packet.buffer);
}

function drive(angle, speed, reverse = false) {
    sendPacket(CMD_DRIVE, 128, 128, angle, speed, reverse);
}

function stop() {
    sendPacket(CMD_STOP, 128, 128, 90, 0, false);
}

// ==================== MODO VOZ ====================
function startVoiceRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        voiceLog.innerHTML = "⚠️ Tu navegador no soporta reconocimiento de voz. Usa Chrome.";
        return;
    }

    if (!voiceRecognition) {
        voiceRecognition = new SpeechRecognition();
        voiceRecognition.lang = 'es-ES';
        voiceRecognition.continuous = true;
        voiceRecognition.interimResults = false;

        voiceRecognition.onstart = () => {
            micIcon.classList.add('mic-active');
            voiceLog.innerText = "Escuchando... (Di 'Adelante', 'Atrás', 'Para'...)";
        };

        voiceRecognition.onresult = (event) => {
            if (currentMode !== 'voice') return;
            const lastResultIndex = event.results.length - 1;
            const command = event.results[lastResultIndex][0].transcript.toLowerCase().trim();
            voiceLog.innerHTML = `🎙️ Comando detectado:<br><b>"${command}"</b>`;
            processVoiceCommand(command);
        };

        voiceRecognition.onerror = (event) => {
            console.error("Error de voz:", event.error);
            micIcon.classList.remove('mic-active');
            if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                voiceLog.innerText = "⚠️ Permiso de micrófono denegado";
            }
        };

        voiceRecognition.onend = () => {
            micIcon.classList.remove('mic-active');
            if (currentMode === 'voice') {
                setTimeout(() => {
                    try { voiceRecognition.start(); } catch(e) {}
                }, 500);
            }
        };
    }
    
    try {
        if (currentMode === 'voice') {
            voiceRecognition.start();
        }
    } catch(e) {
        // Ya está escuchando
    }
}

function stopVoiceRecognition() {
    if (voiceRecognition) {
        try {
            voiceRecognition.stop();
        } catch(e) {}
        micIcon.classList.remove('mic-active');
        voiceLog.innerText = "Reconocimiento de voz detenido";
    }
}

function processVoiceCommand(comandoVoice) {
    const comandos = {
        'adelante':  { angle: 90,  speed: 200 },
        'avanza':    { angle: 90,  speed: 200 },
        'atrás':     { angle: 270, speed: 200 },
        'retrocede': { angle: 270, speed: 200 },
        'izquierda': { angle: 180, speed: 150 },
        'derecha':   { angle: 0,   speed: 150 },
        'para':      { angle: 90,  speed: 0 },
        'detente':   { angle: 90,  speed: 0 },
        'stop':      { angle: 90,  speed: 0 }
    };

    let match = null;
    for (const clave in comandos) {
        if (comandoVoice.includes(clave)) {
            match = comandos[clave];
            break;
        }
    }

    if (!match) {
        voiceLog.innerText = `❓ Comando no reconocido: "${comandoVoice}"`;
        return;
    }

    // ESCUDO DE SEGURIDAD DIRECCIONAL
    if (match.speed > 0) {
        if (match.angle === 90 && tofFrontal < DISTANCIA_SEGURA) {
            console.warn("🛡️ Bloqueo: Obstáculo adelante");
            stop();
            return;
        }
        if (match.angle === 180 && tofIzquierdo < DISTANCIA_SEGURA) {
            console.warn("🛡️ Bloqueo: Obstáculo a la izquierda");
            stop();
            return;
        }
        if (match.angle === 0 && tofDerecho < DISTANCIA_SEGURA) {
            console.warn("🛡️ Bloqueo: Obstáculo a la derecha");
            stop();
            return;
        }
    }

    if (match.speed === 0) {
        stop();
    } else {
        drive(match.angle, match.speed);
        // Auto-stop después de 1 segundo para comandos de voz
        setTimeout(() => {
            if (currentMode === 'voice') stop();
        }, 1000);
    }
}

// ==================== YOLO ====================
async function initYOLO() {
    if (session) {
        startYOLOLoop();
        return;
    }
    
    lblStatus.innerText = '⏳ Cargando modelo YOLO11n...';
    try {
        session = await ort.InferenceSession.create(
            'https://pemazzara.github.io/robot-models/yolo11n.onnx',
            { executionProviders: ['wasm'] }
        );
        lblStatus.innerText = '📹 YOLO listo - Modo seguimiento activo';
        startYOLOLoop();
    } catch (e) {
        console.error('Error cargando YOLO:', e);
        lblStatus.innerText = '❌ Error cargando modelo ONNX';
        currentMode = 'manual';
        document.querySelector('[data-mode="manual"]').click();
    }
}

function startYOLOLoop() {
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
    }
    lastFpsTime = performance.now();
    fpsCounter = 0;
    isProcessing = false;
    processFrame();
}

async function processFrame() {
    // Solo procesar si estamos en modo YOLO
    if (currentMode !== 'yolo') {
        animationFrameId = null;
        return;
    }
    
    // Verificar si la imagen del stream está disponible
    if (!isProcessing && imgStream.complete && imgStream.naturalWidth > 0) {
        isProcessing = true;
        
        const fw = imgStream.naturalWidth;
        const fh = imgStream.naturalHeight;
        
        try {
            // Actualizar dimensiones del canvas si es necesario
            if (canvas.width !== fw || canvas.height !== fh) {
                canvas.width = fw;
                canvas.height = fh;
                offscreenCanvas.width = fw;
                offscreenCanvas.height = fh;
            }
            
            // Dibujar frame actual
            ctx.drawImage(imgStream, 0, 0, fw, fh);
            offscreenCtx.drawImage(imgStream, 0, 0, fw, fh);
            
            // Ejecutar inferencia YOLO
            if (session) {
                const inputTensor = preprocessImage(offscreenCanvas);
                const outputMap = await session.run({ images: inputTensor });
                const detections = processOutput(outputMap, fw, fh);
                
                // Dibujar detecciones
                drawDetections(detections);
                
                // Control del robot basado en detecciones
                const target = selectTarget(detections);
                const now = performance.now();  // ← SOLO UNA DECLARACIÓN

                if (target) {
                    sendDrivingCommand(target, fw, fh);
                    lastDriveCommandTime = now;  // ← ACTUALIZAR TIMESTAMP
                } else if (now - lastDriveCommandTime > DRIVE_COMMAND_TIMEOUT) {
                    // Solo enviar STOP si ha pasado suficiente tiempo desde el último DRIVE
                    stop();
                    console.log('🛑 STOP: Sin detección por >500ms');
                }
                // Si no ha pasado el timeout, mantener el último comando DRIVE
            }
            
            // Actualizar FPS (usar el mismo 'now' declarado arriba)
            fpsCounter++;
            const fpsNow = performance.now();  // ← RENOMBRAR PARA EVITAR CONFLICTO
            if (fpsNow - lastFpsTime >= 1000) {
                fpsDisplay.innerText = `FPS: ${fpsCounter}`;
                fpsCounter = 0;
                lastFpsTime = fpsNow;
            }
            
        } catch (e) {
            console.error("⚠️ Error en YOLO:", e);
        } finally {
            isProcessing = false;  // ← SOLO EN FINALLY
        }
    }
    
    // Programar siguiente frame solo si seguimos en modo YOLO
    if (currentMode === 'yolo') {
        animationFrameId = requestAnimationFrame(processFrame);
    } else {
        animationFrameId = null;
    }
}

function preprocessImage(sourceCanvas) {
    const targetSize = INPUT_SIZE;
    
    // Crear canvas de IA si no existe
    if (!window.aiCanvas) {
        window.aiCanvas = document.createElement('canvas');
        window.aiCanvas.width = targetSize;
        window.aiCanvas.height = targetSize;
        window.aiCtx = window.aiCanvas.getContext('2d', { willReadFrequently: true });
    }
    
    // Redimensionar a 640x640
    window.aiCtx.drawImage(sourceCanvas, 0, 0, targetSize, targetSize);
    
    const imageData = window.aiCtx.getImageData(0, 0, targetSize, targetSize);
    const data = imageData.data;
    
    // Crear tensor CHW
    const imageSize = targetSize * targetSize;
    const float32Array = new Float32Array(3 * imageSize);
    
    for (let i = 0; i < imageSize; i++) {
        float32Array[i] = data[i * 4] / 255.0;
        float32Array[imageSize + i] = data[i * 4 + 1] / 255.0;
        float32Array[2 * imageSize + i] = data[i * 4 + 2] / 255.0;
    }
    
    return new ort.Tensor('float32', float32Array, [1, 3, targetSize, targetSize]);
}

function processOutput(outputMap, ow, oh) {
    let output = null;
    for (const key of Object.keys(outputMap)) {
        output = outputMap[key];
        break;
    }
    if (!output) return [];
    
    const data = output.data;
    const dims = output.dims;
    const numClasses = dims[1] - 4;
    const numAnchors = dims[2];
    const detections = [];
    
    // Solo buscar clase 0 (persona)
    const classIdx = CLASS_TARGET;
    
    for (let c = 0; c < numAnchors; c++) {
        const conf = data[(4 + classIdx) * numAnchors + c];
        
        if (conf > CONF_THRESHOLD) {
            let cx = data[0 * numAnchors + c];
            let cy = data[1 * numAnchors + c];
            let w = data[2 * numAnchors + c];
            let h = data[3 * numAnchors + c];
            
            // Convertir coordenadas
            if (cx > 1.0 || cy > 1.0 || w > 1.0 || h > 1.0) {
                cx = (cx / INPUT_SIZE) * ow;
                cy = (cy / INPUT_SIZE) * oh;
                w = (w / INPUT_SIZE) * ow;
                h = (h / INPUT_SIZE) * oh;
            } else {
                cx = cx * ow;
                cy = cy * oh;
                w = w * ow;
                h = h * oh;
            }
            
            const x1 = cx - w / 2;
            const y1 = cy - h / 2;
            
            detections.push({
                x1, y1,
                x2: cx + w / 2,
                y2: cy + h / 2,
                cx, cy, w, h,
                confidence: conf,
                class: classIdx
            });
        }
    }
    
    return applyNMS(detections);
}

function applyNMS(dets) {
    dets.sort((a, b) => b.confidence - a.confidence);
    const keep = [];
    
    for (let i = 0; i < dets.length; i++) {
        let suppress = false;
        for (let j = 0; j < keep.length; j++) {
            if (dets[i].class !== keep[j].class) continue;
            
            const xA = Math.max(dets[i].x1, keep[j].x1);
            const yA = Math.max(dets[i].y1, keep[j].y1);
            const xB = Math.min(dets[i].x2, keep[j].x2);
            const yB = Math.min(dets[i].y2, keep[j].y2);
            const inter = Math.max(0, xB - xA) * Math.max(0, yB - yA);
            const iou = inter / (dets[i].w * dets[i].h + keep[j].w * keep[j].h - inter);
            
            if (iou > IOU_THRESHOLD) {
                suppress = true;
                break;
            }
        }
        if (!suppress) keep.push(dets[i]);
    }
    return keep;
}

function selectTarget(dets) {
    const targets = dets.filter(d => d.class === CLASS_TARGET);
    if (!targets.length) return null;
    targets.sort((a, b) => (b.w * b.h) - (a.w * a.h));
    return targets[0];
}

function drawDetections(dets) {
    for (const d of dets) {
        const isTarget = d.class === CLASS_TARGET;
        ctx.strokeStyle = isTarget ? '#00ff00' : '#4488ff';
        ctx.lineWidth = isTarget ? 3 : 2;
        ctx.strokeRect(d.x1, d.y1, d.w, d.h);
        
        if (isTarget) {
            // Dibujar punto central
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(d.cx - 15, d.cy);
            ctx.lineTo(d.cx + 15, d.cy);
            ctx.moveTo(d.cx, d.cy - 15);
            ctx.lineTo(d.cx, d.cy + 15);
            ctx.stroke();
            
            // Mostrar confianza
            ctx.fillStyle = '#00ff00';
            ctx.font = 'bold 14px monospace';
            ctx.fillText(`${(d.confidence * 100).toFixed(0)}%`, d.x1, d.y1 - 6);
        }
    }
}



function sendDrivingCommand(target, fw, fh) {
    // Cálculo del ángulo
    const errorX = target.cx - fw / 2;
    let angleDeg = 90 - (errorX / (fw / 2)) * 45;
    angleDeg = Math.max(0, Math.min(180, angleDeg));
    
    // Cálculo de velocidad por tamaño
    const areaRatio = (target.w * target.h) / (fw * fh);
    const AREA_FRENO = 0.6;
    const AREA_LENTO = 0.3;
    const AREA_MEDIO = 0.1;
    const MAX_SPEED = 255;
    
    let speed;
    if (areaRatio >= AREA_FRENO) {
        speed = 0;
    } else if (areaRatio >= AREA_LENTO) {
        speed = Math.round(((AREA_FRENO - areaRatio) / (AREA_FRENO - AREA_LENTO)) * 80);
    } else if (areaRatio >= AREA_MEDIO) {
        speed = Math.round(80 + ((AREA_LENTO - areaRatio) / (AREA_LENTO - AREA_MEDIO)) * 100);
    } else {
        speed = Math.round(180 + ((AREA_MEDIO - areaRatio) / AREA_MEDIO) * 75);
        speed = Math.min(MAX_SPEED, speed);
    }
    speed = Math.max(0, Math.min(MAX_SPEED, speed));
    
    // ESCUDO DE SEGURIDAD CON ToF
    if (tofFrontal < DISTANCIA_SEGURA) {
        speed = 0;  
        console.warn(`🛑 FRENO ToF: obstáculo frontal a ${tofFrontal}cm`);
    } else if (tofFrontal < DISTANCIA_PRECAUCION) {
        const factor = (tofFrontal - DISTANCIA_SEGURA) / (DISTANCIA_PRECAUCION - DISTANCIA_SEGURA);
        speed = Math.round(speed * factor);
    }
    
    // Bloquear giros peligrosos
    if (angleDeg < 75 && tofDerecho < DISTANCIA_SEGURA) {
        angleDeg = 90;
        speed = 0;
    } else if (angleDeg > 105 && tofIzquierdo < DISTANCIA_SEGURA) {
        angleDeg = 90;
        speed = 0;
    }
    
    const xCent = Math.round((target.cx / fw) * 255);
    const yCent = Math.round((target.cy / fh) * 255);
    
    sendPacket(CMD_DRIVE, xCent, yCent, angleDeg, speed, false);
    lastDriveCommandTime = performance.now();
    console.log(`🚗 DRIVE: speed=${speed} angle=${angleDeg.toFixed(1)}° centro=(${xCent},${yCent})`);
}

    connectWebSocket();
    lblStatus.innerText = '🔗 Conectando al robot...';
});

window.addEventListener('beforeunload', () => {
    stop();
    clearInterval(manualInterval);
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
    }
    if (voiceRecognition) {
        try { voiceRecognition.stop(); } catch(e) {}
    }
});
